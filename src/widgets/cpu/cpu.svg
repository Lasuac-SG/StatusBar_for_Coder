<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 芯片主体外框 -->
    <rect x="5.5" y="5.5" width="13" height="13" rx="2" />
    
    <!-- 内部核心晶片 -->
    <rect x="9.5" y="9.5" width="5" height="5" rx="0.8" />
    
    <!-- 顶部引脚 -->
    <line x1="8.5" y1="1.5" x2="8.5" y2="5.5" />
    <line x1="12" y1="1.5" x2="12" y2="5.5" />
    <line x1="15.5" y1="1.5" x2="15.5" y2="5.5" />
    
    <!-- 底部引脚 -->
    <line x1="8.5" y1="18.5" x2="8.5" y2="22.5" />
    <line x1="12" y1="18.5" x2="12" y2="22.5" />
    <line x1="15.5" y1="18.5" x2="15.5" y2="22.5" />
    
    <!-- 左侧引脚 -->
    <line x1="1.5" y1="8.5" x2="5.5" y2="8.5" />
    <line x1="1.5" y1="12" x2="5.5" y2="12" />
    <line x1="1.5" y1="15.5" x2="5.5" y2="15.5" />
    
    <!-- 右侧引脚 -->
    <line x1="18.5" y1="8.5" x2="22.5" y2="8.5" />
    <line x1="18.5" y1="12" x2="22.5" y2="12" />
    <line x1="18.5" y1="15.5" x2="22.5" y2="15.5" />
</svg>
